# Database Configuration for Student Feedback System
# Primary: MySQL Database
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/student_feedback_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.user=root
db.password=root

# Fallback In-Memory/Embedded DB (H2) for instant demo if MySQL is unreachable
h2.driver=org.h2.Driver
h2.url=jdbc:h2:mem:student_feedback_db;DB_CLOSE_DELAY=-1;MODE=MySQL
h2.user=sa
h2.password=
